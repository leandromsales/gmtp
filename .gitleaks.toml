# .gitleaks.toml — extend the default ruleset and allowlist only the
# exact values confirmed as false positives in a full-history scan
# (`gitleaks detect --no-banner --redact --log-opts=--all`).
# No live application credentials are listed here.
[extend]
useDefault = true

[[allowlists]]
description = "Exact false-positive values from a full-history gitleaks scan: vendored Linux kernel identifiers (crypto/wifi/keypad/selftests) and a commented 2014 ACM Digital Library paper-URL query parameter in docs/thesis. Not application secrets."
